name: Release

# Publishes @fuad24/gitbridge to npm with provenance when a version tag is pushed.
# Users can then verify that the package on npm was built from this repository:
#   npm audit signatures
#
# One-time setup for the maintainer: add an npm access token with publish rights
# as the repository secret NPM_TOKEN (Settings -> Secrets and variables -> Actions).
# Provenance needs id-token: write and a public repository, both satisfied here.
#
# Release flow:
#   1. bump "version" in package.json and src/version.ts
#   2. git tag v<version> && git push --tags

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check that the tag matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Publish
        # prepublishOnly would rerun the test and build steps above; skip it.
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
