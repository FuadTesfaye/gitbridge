name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # The suite asserts on plain-text CLI output; GitHub sets CI=true, which
      # makes picocolors emit ANSI codes. Keep output colorless here.
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # tests/setup/isolate-home.ts is preloaded: the run uses a throwaway home.
        run: bun test

      - name: Build
        run: bun run build
