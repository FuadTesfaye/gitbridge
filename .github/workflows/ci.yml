name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    env:
      # The suite asserts on plain-text CLI output; GitHub sets CI=true, which
      # makes picocolors emit ANSI codes. Keep output colorless here.
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # tests/setup/isolate-home.ts is preloaded: the run uses a throwaway home.
        run: bun test

      - name: Build
        run: bun run build

  publish:
    name: Publish to npm
    needs: test
    if: github.repository == 'FuadTesfaye/gitbridge' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish new version to npm
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Inspecting registry for ${PKG_NAME}@${PKG_VERSION}..."

          if npm view "${PKG_NAME}@${PKG_VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "Version ${PKG_VERSION} of ${PKG_NAME} is already published on npm. Skipping publication."
          else
            echo "New version detected. Publishing ${PKG_NAME}@${PKG_VERSION} to npm with provenance..."
            npm publish --provenance --access public --ignore-scripts || npm publish --access public --ignore-scripts
            echo "Successfully published ${PKG_NAME}@${PKG_VERSION} to npm!"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
